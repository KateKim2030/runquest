<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1E4D1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="런퀘스트">
<title>런퀘스트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Russo+One&display=swap">
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<style>
/* One look: a calm sports poster. Bone paper, royal-blue ink, powder-blue sky; flat outlined illustrations of one recurring runner. */
:root {
  --bg: #F1E4D1; --bg2: #fbf6ee; --card: #e8dac4; --line: #dccab0; --ink: #162660; --soft: #4b5785; --dim: #8a91ab;
  --run: #162660; --run-d: #0a1338; --walk: #D0E6FD; --walk-d: #98bde6; --fast: #f3c766; --fast-d: #c99c3c;
  --warm: #e8d6bb; --warm-d: #cdb48f; --gold: #f3c766; --gold-d: #c99c3c; --pink: #ef8a62; --hi: #c75a33;
  --edge: #d3bf9f; --nav: #fbf6eef2; --quest: #e4eefb; --paused: #4b5785; --sel: #D0E6FD;
  --on-run: #fbf6ee; --on-walk: #162660; --on-fast: #162660; --on-gold: #162660; --on-warm: #162660;
  --sky: none;
  --skin: #f4cfb0; --skin-d: #e2b38f; --shirt: #ef8a62; --shirt-d: #d16f48;
  --title: "Black Han Sans", "Jua", sans-serif; --fun: "Jua", "Noto Sans KR", "Malgun Gothic", sans-serif; --num: "Russo One", "Jua", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--fun); }
body { min-height: 100dvh; background: var(--bg); background-image: var(--sky); background-attachment: fixed; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

/* header */
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 75%, transparent); padding: calc(10px + env(safe-area-inset-top)) 0 14px; }
.top { display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--title); font-size: 26px; letter-spacing: .5px; line-height: 1; }
.logo b { color: var(--hi); font-weight: 400; }
.logo small { display: block; font-family: var(--num); font-size: 10px; letter-spacing: 3px; color: var(--dim); margin-top: 4px; }
.lv { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.lvbadge { font-family: var(--num); font-size: 13px; background: var(--gold); color: var(--on-gold); border-radius: 10px; padding: 5px 8px 4px; box-shadow: 0 3px 0 var(--gold-d); }
.xpbar { width: 86px; height: 10px; border-radius: 6px; background: var(--card); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--run)); border-radius: 6px; transition: width .6s; }
.xptxt { font-family: var(--num); font-size: 10px; color: var(--dim); text-align: right; margin-top: 3px; }

/* candy buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 58px; border-radius: 18px;
  font-family: var(--title); font-size: 22px; letter-spacing: .5px; background: var(--run); color: var(--on-run); box-shadow: 0 6px 0 var(--run-d); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--run-d); }
.btn.green { background: var(--walk); box-shadow: 0 6px 0 var(--walk-d); color: var(--on-walk); }
.btn.green:active { box-shadow: 0 1px 0 var(--walk-d); }
.btn.ghost { background: var(--card); box-shadow: 0 5px 0 var(--edge); color: var(--ink); font-family: var(--fun); font-size: 18px; min-height: 52px; }
.btn.ghost:active { box-shadow: 0 1px 0 var(--edge); }
.btn.small { min-height: 44px; font-size: 16px; border-radius: 14px; }
.link { color: var(--soft); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; padding: 10px; display: block; margin: 6px auto 0; }

.card { background: var(--bg2); border: 2px solid var(--line); border-radius: 24px; padding: 18px; margin-bottom: 16px; }
.eyebrow { font-family: var(--num); font-size: 11px; letter-spacing: 2.5px; color: var(--hi, var(--gold)); }
h2 { font-family: var(--title); font-weight: 400; font-size: 28px; margin: 4px 0 2px; line-height: 1.15; }
.sub { color: var(--soft); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { background: var(--card); border-radius: 999px; padding: 6px 11px 5px; font-size: 14px; }
.chip b { font-family: var(--num); font-weight: 400; color: var(--hi, var(--gold)); }

/* segment strip */
.strip { display: flex; gap: 3px; height: 22px; margin: 4px 0 14px; }
.strip i { border-radius: 5px; min-width: 3px; }
.t-warm, .t-cool { background: var(--warm); } .t-walk { background: var(--walk); } .t-fast { background: var(--fast); } .t-run { background: var(--run); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--soft); margin: -6px 0 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.desc { font-size: 15px; color: var(--soft); line-height: 1.55; margin: 0 0 16px; }

/* today */
.ringrow { display: flex; align-items: center; gap: 14px; }
.ringrow > div:last-child { flex: 1; min-width: 0; }
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .num b { font-family: var(--num); font-weight: 400; font-size: 26px; line-height: 1; }
.goal2 { font-size: 16px; margin-top: 3px; white-space: nowrap; }
.goal2 i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
.goal2 b { font-family: var(--num); font-weight: 400; }
.ring .num span { font-size: 13px; color: var(--soft); }
.weekdots { display: flex; gap: 4px; margin: 8px 0 4px; }
.weekdots i { flex: 1; min-width: 20px; max-width: 30px; aspect-ratio: 1; border-radius: 10px; background: var(--card); display: grid; place-items: center; font-style: normal; font-size: 12px; color: var(--dim); }
.weekdots i.on { background: var(--walk); color: var(--on-walk); }
.weekdots i.today { outline: 2px solid var(--gold); outline-offset: 1px; }
.streak { font-size: 15px; color: var(--soft); }
.streak b { color: var(--hi, var(--gold)); font-weight: 400; }
.manual { display: flex; gap: 10px; align-items: center; }
.manual .btn { flex: 1; }
.undo { color: var(--dim); font-size: 14px; padding: 8px; }
.quest { position: relative; overflow: hidden; border-color: var(--run); background: linear-gradient(160deg, var(--quest), var(--bg2) 60%); }
.quest.rest { border-color: var(--walk); }
.scene { position: relative; margin: -18px -18px 16px; height: 150px; border-radius: 22px 22px 0 0; overflow: hidden; display: flex; justify-content: center; align-items: flex-end;
  background: radial-gradient(28px 14px at 18% 30%, #fffc 60%, transparent 62%), radial-gradient(38px 16px at 80% 22%, #fffc 60%, transparent 62%), var(--walk); border-bottom: 2px solid var(--line); }
.scene.night { background: radial-gradient(2px 2px at 20% 30%, #fff 60%, transparent 62%), radial-gradient(2px 2px at 70% 18%, #fff 60%, transparent 62%), radial-gradient(1.5px 1.5px at 40% 60%, #fff 60%, transparent 62%), #2b3a78; }
.scene svg { height: 150px; width: 150px; flex: none; }
.scene.wide svg { width: 190px; }

/* map */
.world-ban { position: absolute; left: 0; right: 0; height: 62px; border-radius: 18px; background: var(--card); display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 2px solid var(--line); }
.world-ban .em { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg2); display: grid; place-items: center; font-family: var(--num); font-size: 16px; flex: none; }
.world-ban b { font-family: var(--title); font-weight: 400; font-size: 19px; display: block; }
.world-ban small { color: var(--soft); font-size: 13px; }
.world-ban .cnt { margin-left: auto; font-family: var(--num); font-size: 15px; color: var(--hi, var(--gold)); }
.map { position: relative; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 70px; margin-left: -35px; text-align: center; }
.node .dot { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-family: var(--num); font-size: 16px; background: var(--card); box-shadow: 0 5px 0 var(--edge); border: 3px solid var(--line); color: var(--dim); }
.node.boss .dot { width: 76px; height: 76px; margin-top: -6px; font-size: 26px; }
.node.done .dot { background: var(--gold); border-color: #fff3; box-shadow: 0 5px 0 var(--gold-d); color: var(--on-gold); font-size: 26px; }
.node.today .dot { background: var(--run); border-color: var(--bg2); box-shadow: 0 5px 0 var(--run-d); color: var(--on-run); animation: pulse 1.6s infinite; }
.node.tomorrow .dot { border-style: dashed; border-color: var(--walk); color: var(--walk); font-size: 22px; }
.node .lab { font-size: 13px; margin-top: 7px; color: var(--soft); white-space: nowrap; }
.node.today .lab { color: var(--ink); }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* log */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.tile { background: var(--bg2); border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
.tile span { font-size: 13px; color: var(--soft); }
.tile b { display: block; font-family: var(--num); font-weight: 400; font-size: 26px; margin-top: 4px; }
.tile b small { font-family: var(--fun); font-size: 14px; color: var(--soft); margin-left: 2px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; position: relative; margin-top: 12px; }
.bars .goal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--gold); opacity: .55; }
.bars .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.bars .col i { width: 100%; max-width: 30px; border-radius: 7px 7px 3px 3px; background: var(--ink); min-height: 3px; }
.bars .col.zero i { background: var(--card); }
.bars .col small { font-family: var(--num); font-size: 11px; color: var(--soft); }
.bars .col.today em { color: var(--hi, var(--gold)); }
.bars .col em { font-style: normal; font-size: 13px; color: var(--dim); }
.rec { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
.rec:first-child { border-top: 0; }
.rec .when { color: var(--dim); font-size: 13px; width: 52px; flex: none; }
.rec .what { flex: 1; }
.rec .t { font-family: var(--num); font-size: 14px; color: var(--soft); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 16px; }
.toggle { width: 56px; height: 32px; border-radius: 99px; background: var(--card); position: relative; transition: background .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.toggle.on { background: var(--walk-d); } .toggle.on::after { transform: translateX(24px); background: #fff; }
.empty { color: var(--dim); font-size: 15px; padding: 8px 0; }

/* bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--nav); border-top: 2px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; backdrop-filter: blur(8px); }
nav button { flex: 1; max-width: 160px; padding: 6px 0 4px; border-radius: 14px; color: var(--dim); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button .ic { width: 26px; height: 26px; opacity: .55; }
nav button.on { color: var(--ink); background: var(--card); }
nav button.on .ic { opacity: 1; }

/* overlays */
.ov { position: fixed; inset: 0; z-index: 20; display: none; }
.ov.show { display: block; }
#dialog { z-index: 40; }
.sheet-bg { position: absolute; inset: 0; background: #0009; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--bg2); border-radius: 28px 28px 0 0; border: 2px solid var(--line); border-bottom: 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow: auto; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.modal { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: #000a; }
.modal .box { width: 100%; max-width: 420px; background: var(--bg2); border: 2px solid var(--line); border-radius: 26px; padding: 22px 18px; animation: up .25s ease-out; }
.modal .box p { color: var(--soft); line-height: 1.6; font-size: 16px; margin: 10px 0; }
.modal .box .btn + .btn { margin-top: 14px; }
.warn { background: color-mix(in srgb, var(--run) 12%, transparent); border: 2px solid color-mix(in srgb, var(--run) 35%, transparent); border-radius: 16px; padding: 12px 14px; color: var(--ink) !important; font-size: 15px !important; }

/* run screen */
#run { background: var(--warm); color: var(--on-warm); transition: background .5s; }
#run.k-run { background: var(--run); color: var(--on-run); } #run.k-walk { background: var(--walk); color: var(--on-walk); } #run.k-fast { background: var(--fast); color: var(--on-fast); }
#run.k-warm, #run.k-cool { background: var(--warm); }
#run.paused { background: var(--paused) !important; color: #fff !important; }
.rs { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
.rs-top { display: flex; align-items: center; justify-content: space-between; font-size: 16px; opacity: .9; }
.rs-top b { font-family: var(--num); font-weight: 400; }
.rs-mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.rs-art { width: clamp(150px, 24vh, 210px); aspect-ratio: 1; margin-bottom: 14px; }
.rs-art svg { width: 100%; height: 100%; animation: bob var(--bob, 1s) ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.rs-kind { font-family: var(--title); font-size: clamp(56px, 18vw, 92px); line-height: 1; }
.rs-count { font-size: 20px; margin-top: 10px; min-height: 26px; }
.rs-clock { font-family: var(--num); font-size: clamp(88px, 30vw, 150px); line-height: 1; margin-top: 18px; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.rs-next { margin-top: 18px; font-size: 19px; background: #0002; border-radius: 99px; padding: 8px 16px 7px; }
.rs-prog { position: relative; display: flex; gap: 2px; height: 16px; margin: 0 0 18px; }
.rs-prog i { border-radius: 4px; background: color-mix(in srgb, currentColor 22%, transparent); min-width: 2px; }
.rs-prog i.cur { background: currentColor; }
.rs-prog i.past { background: color-mix(in srgb, currentColor 55%, transparent); }
.rs-prog .me { position: absolute; top: -6px; width: 4px; height: 28px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 2px #0004; transition: left .3s linear; }
.rs-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rs-btns .btn { background: var(--bg2); color: var(--ink); box-shadow: 0 6px 0 #0003; }
.rs-btns .btn:active { box-shadow: 0 1px 0 #0004; }
.rs-btns .btn.stop { background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; box-shadow: 0 6px 0 #0002; font-family: var(--fun); font-size: 18px; }
.rs-dim { margin-top: 12px; font-size: 15px; opacity: .85; padding: 10px; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
.dimmer { position: absolute; inset: 0; background: #000; color: #8a8a8a; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 2; }
.dimmer.show { display: flex; }
.dimmer .k { font-family: var(--title); font-size: 44px; }
.dimmer .c { font-family: var(--num); font-size: 96px; margin: 8px 0; color: #a0a0a0; }
.dimmer small { font-size: 15px; color: #555; margin-top: 24px; }

/* result */
#result .modal { background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--run) 30%, transparent), #000b 70%); }
.burst svg { width: 150px; height: 150px; display: block; margin: 0 auto; }
.burst { font-size: 64px; text-align: center; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.2) rotate(-20deg); opacity: 0; } }
.clear-title { font-family: var(--title); font-size: 38px; text-align: center; line-height: 1.1; margin: 6px 0; color: var(--hi, var(--gold)); text-shadow: 0 3px 0 var(--edge); }
.gain { text-align: center; font-family: var(--num); font-size: 26px; margin: 10px 0 4px; }
.gain small { display: block; font-family: var(--fun); font-size: 16px; color: var(--soft); margin-top: 6px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 6px; }
.rate button { background: var(--card); border-radius: 16px; padding: 12px 4px; font-size: 15px; border: 2px solid transparent; }
.rate button span { display: block; font-size: 28px; margin-bottom: 4px; }
.rate button.sel { border-color: var(--hi, var(--gold)); background: var(--sel); }
.rate-q { text-align: center; color: var(--soft); font-size: 15px; margin-top: 14px; }
.hint { text-align: center; color: var(--soft); font-size: 14px; min-height: 20px; margin: 4px 0 12px; }


/* home category switch (same idea as the English app's 말하기/듣기) */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; background: var(--card); padding: 5px; border-radius: 20px; }
.mode { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 15px; text-align: left; color: var(--soft); min-width: 0; }
.mode .mi { width: 46px; height: 46px; flex: none; background: var(--bg2); border-radius: 50%; overflow: hidden; }
.mode .mi svg { width: 100%; height: 100%; display: block; }
.mode b { display: block; font-family: var(--title); font-weight: 400; font-size: 21px; line-height: 1.1; color: inherit; }
.mode small { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg2); box-shadow: 0 3px 0 var(--run-d); }
.mode[aria-pressed="true"] small { color: color-mix(in srgb, var(--bg2) 80%, transparent); }

/* strength quest, badges */
.qhead { display: flex; justify-content: space-between; align-items: flex-start; }
.qpips { display: flex; gap: 5px; margin-top: 4px; }
.qpips i { width: 14px; height: 14px; border-radius: 50%; background: var(--card); }
.qpips i.on { background: var(--gold); box-shadow: 0 2px 0 var(--gold-d); }
.qcard.clear { border-color: var(--gold); }
.qrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type { margin-top: 10px; }
.qrow .mi { width: 52px; height: 52px; border-radius: 50%; background: var(--walk); overflow: hidden; flex: none; }
.qrow .mi svg { width: 100%; height: 100%; display: block; }
.qrow .nm { flex: 1; font-size: 17px; min-width: 0; }
.qrow .nm small { display: block; color: var(--soft); font-size: 13px; }
.qrow.done .nm { color: var(--soft); }
.qrow .go { background: var(--ink); color: var(--bg2); border-radius: 12px; padding: 9px 14px 8px; font-size: 15px; box-shadow: 0 3px 0 var(--run-d); flex: none; }
.qrow .go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--run-d); }
.qrow .ok { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; font-size: 18px; color: var(--ink); box-shadow: 0 2px 0 var(--gold-d); flex: none; }
.qnote { font-size: 13px; color: var(--soft); margin-top: 8px; }
.weekdots i { position: relative; }
.weekdots i.str::after { content: ""; position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--hi); border: 2px solid var(--bg2); }
.badge-new { display: flex; align-items: center; gap: 10px; justify-content: center; background: var(--bg2); border: 2px solid var(--gold); border-radius: 16px; padding: 10px 14px; margin: 8px auto 0; font-size: 16px; max-width: 320px; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); }
.medal { width: 30px; height: 30px; border-radius: 50%; background: var(--card); color: var(--dim); display: grid; place-items: center; font-family: var(--num); font-size: 9px; flex: none; }
.medal.on { background: var(--gold); color: var(--ink); box-shadow: 0 2px 0 var(--gold-d); font-size: 14px; }
.brow { padding: 12px 0; border-top: 1px solid var(--line); }
.brow:first-of-type { border-top: 0; }
.brow .bt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 16px; }
.brow .bt small { color: var(--soft); font-size: 13px; }
.medals { display: flex; gap: 6px; margin-top: 8px; }
.bbar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bbar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.sk-done { overflow-y: auto; }
.sk-done .burst svg { width: 120px; height: 120px; }
/* snack workouts */
.snack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sn { background: var(--bg2); border: 2px solid var(--line); border-radius: 20px; padding: 10px 10px 12px; text-align: left; position: relative; }
.sn:active { transform: scale(.97); }
.sn .pic { background: var(--walk); border-radius: 14px; aspect-ratio: 1.15; display: flex; justify-content: center; overflow: hidden; }
.sn .pic svg { height: 100%; }
.sn b { display: block; font-size: 17px; margin-top: 8px; font-weight: 400; }
.sn small { color: var(--soft); font-size: 14px; }
.sn .cnt { position: absolute; top: 16px; right: 16px; background: var(--ink); color: var(--bg2); border-radius: 99px; font-size: 12px; padding: 3px 8px 2px; }
.quick { display: flex; gap: 8px; }
.quick button { flex: 1; min-width: 0; background: var(--walk); border-radius: 16px; padding: 6px 4px 10px; font-size: 14px; box-shadow: 0 4px 0 var(--walk-d); color: var(--ink); }
.quick button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--walk-d); }
.quick svg { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }
.bigpic { background: var(--walk); border-radius: 20px; height: 190px; display: flex; justify-content: center; margin-bottom: 14px; }
.bigpic svg { height: 100%; }
.speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); padding: 5px; border-radius: 16px; margin: -4px 0 18px; }
.speeds button { padding: 8px 4px 7px; border-radius: 12px; color: var(--soft); }
.speeds b { display: block; font-weight: 400; font-size: 17px; }
.speeds small { font-size: 12px; }
.speeds button[aria-pressed="true"] { background: var(--ink); color: var(--bg2); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 4px 0 18px; }
.stepper button { width: 54px; height: 54px; border-radius: 50%; background: var(--card); font-size: 30px; line-height: 1; font-family: var(--num); box-shadow: 0 4px 0 var(--edge); }
.stepper button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.stepper b { font-family: var(--num); font-weight: 400; font-size: 42px; min-width: 120px; text-align: center; }
.stepper b small { font-family: var(--fun); font-size: 18px; margin-left: 2px; }
#snack { background: var(--bg); color: var(--ink); }
.sk { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
.sk-top { display: flex; justify-content: space-between; align-items: center; font-size: 19px; }
.sk-top button { font-size: 15px; color: var(--soft); padding: 8px; }
.sk-pic { position: relative; width: min(74vw, 290px, 36vh); aspect-ratio: 1; margin: 10px auto 0; background: var(--walk); border-radius: 50%; overflow: hidden; flex: none; }
.sk-pic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sk-pic svg.off { visibility: hidden; }
.sk-num { font-family: var(--num); font-size: clamp(88px, 27vw, 136px); text-align: center; line-height: 1; margin-top: 12px; }
.sk-num small { font-size: .3em; color: var(--soft); margin-left: 4px; }
.sk-cue { text-align: center; font-family: var(--title); font-size: 30px; min-height: 40px; color: var(--hi); margin-top: 4px; }
.sk-bar { height: 12px; border-radius: 6px; background: var(--card); overflow: hidden; margin: 14px 0 18px; }
.sk-bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 6px; transition: width .25s linear; }
.sk-sp { flex: 1; }
.sk-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo">런<b>퀘스트</b><small>RUN QUEST</small></div>
      <div class="lv"><div><div class="xpbar"><i id="xpfill"></i></div><div class="xptxt" id="xptxt"></div></div><div class="lvbadge" id="lvbadge"></div></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav>
  <button data-tab="today" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>홈</button>
  <button data-tab="map"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2.5 6 2.5 6-2.5v14.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 3.5V18M15 6v14.5"/></svg>지도</button>
  <button data-tab="log"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9M3 20.5h18"/></svg>기록</button>
</nav>

<div class="ov" id="sheet"><div class="sheet-bg" data-close></div><div class="sheet" id="sheetbox"></div></div>
<div class="ov" id="dialog"><div class="modal"><div class="box" id="dialogbox"></div></div></div>
<div class="ov" id="result"><div class="modal"><div class="box" id="resultbox"></div></div></div>
<div class="ov" id="snack"><div class="sk" id="skbox"></div></div>
<div class="ov" id="run">
  <div class="rs">
    <div class="rs-top"><span id="r-stage"></span><span>남은 시간 <b id="r-total"></b></span></div>
    <div class="rs-mid">
      <div class="rs-art" id="r-art"></div>
      <div class="rs-kind" id="r-kind"></div>
      <div class="rs-count" id="r-count"></div>
      <div class="rs-clock" id="r-clock"></div>
      <div class="rs-next" id="r-next"></div>
    </div>
    <div class="rs-prog" id="r-prog"></div>
    <div class="rs-btns">
      <button class="btn stop" id="r-stop">그만하기</button>
      <button class="btn" id="r-pause">일시정지</button>
    </div>
    <button class="rs-dim" id="r-dim">화면 어둡게 (배터리 아끼기)</button>
  </div>
  <div class="dimmer" id="dimmer"><div class="k" id="d-kind"></div><div class="c" id="d-clock"></div><div id="d-next"></div><small>화면을 누르면 밝아져요</small></div>
</div>

<script src="logic.js" charset="utf-8"></script>
<script src="art.js" charset="utf-8"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const today = () => RQ.dayKey(new Date());
let S = RQ.load(localStorage);
let tab = "today";
const persist = () => RQ.save(localStorage, S);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mins = (sec) => { const m = Math.round(sec / 60); return m + "분"; };
const strip = (segs) => '<div class="strip">' + segs.map((x) => '<i class="t-' + x[0] + '" style="flex:' + x[1] + '"></i>').join("") + "</div>";
const LEGEND = '<div class="legend"><span style="--c:var(--warm)">준비·마무리</span><span style="--c:var(--walk)">걷기</span><span style="--c:var(--fast)">빠르게 걷기</span><span style="--c:var(--run)">뛰기</span></div>';

// "준비 걷기 5분 → 뛰기 1분 5번 (사이 걷기 2분) → 마무리 걷기 5분"
function describe(segs) {
  const core = segs.slice(1, -1), parts = ["준비 걷기 " + RQ.fmtSay(segs[0][1])];
  const on = core[0], rest = core[1];
  const isReps = rest && core.every((x, i) => (i % 2 ? x[0] === rest[0] && x[1] === rest[1] : x[0] === on[0] && x[1] === on[1])) && core.length % 2 === 1;
  if (isReps) parts.push(RQ.NAMES[on[0]] + " " + RQ.fmtSay(on[1]) + " " + ((core.length + 1) / 2) + "번 (사이마다 " + RQ.NAMES[rest[0]] + " " + RQ.fmtSay(rest[1]) + ")");
  else core.forEach((x) => parts.push(RQ.NAMES[x[0]] + " " + RQ.fmtSay(x[1])));
  parts.push("마무리 걷기 " + RQ.fmtSay(segs[segs.length - 1][1]));
  return parts.join(" → ");
}
function stageChips(st) {
  const r = RQ.runSec(st);
  return '<div class="chips"><span class="chip">총 <b>' + mins(RQ.totalSec(st)) + '</b></span><span class="chip">' + (r ? '뛰기 <b>' + RQ.fmtSay(r) + "</b>" : "걷기만") +
    '</span><span class="chip">보상 <b>+' + RQ.xpFor(st) + " XP</b></span></div>";
}

// ---------------- header ----------------
function drawHeader() {
  const L = RQ.level(S.xp);
  $("lvbadge").textContent = "Lv." + L.lv;
  $("xpfill").style.width = Math.round((L.into / L.need) * 100) + "%";
  $("xptxt").textContent = L.into + " / " + L.need + " XP";
}

// ---------------- today ----------------
// Two goals in one badge: outer ring = minutes moved today, inner ring = today's strength quest (0-3).
function ringSvg(min, got) {
  const arc = (r, w, p, col) => { const c = 2 * Math.PI * r;
    return '<circle cx="58" cy="58" r="' + r + '" fill="none" style="stroke:var(--card)" stroke-width="' + w + '"/>' +
      (p > 0 ? '<circle cx="58" cy="58" r="' + r + '" fill="none" style="stroke:' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + (c * Math.min(1, p)).toFixed(1) + " " + c.toFixed(1) + '"/>' : ""); };
  return '<svg viewBox="0 0 116 116">' + arc(52, 10, min / RQ.GOAL_MIN, min >= RQ.GOAL_MIN ? "var(--gold)" : "var(--ink)") + arc(39, 8, got / 3, got >= 3 ? "var(--gold)" : "var(--hi)") + "</svg>";
}
function viewToday() {
  const t = today(), min = RQ.minutesOn(S, t), wk = RQ.week(S, t), streak = RQ.streakWeeks(S, t), plan = RQ.todayPlan(S, t);
  const names = ["월", "화", "수", "목", "금", "토", "일"], mode = S.mode === "strength" ? "strength" : "cardio";
  let h = '<div class="modes" role="group" aria-label="운동 종류">' +
    '<button class="mode" data-mode="cardio" aria-pressed="' + (mode === "cardio") + '"><span class="mi">' + RQART.svg("run") + '</span><span><b>유산소</b><small>걷기 · 달리기</small></span></button>' +
    '<button class="mode" data-mode="strength" aria-pressed="' + (mode === "strength") + '"><span class="mi">' + RQART.ex("squat", 1) + '</span><span><b>근력</b><small>스쿼트 · 플랭크</small></span></button></div>';
  const got = RQ.strengthQuest(S, t).filter((it) => it.done).length, both = min >= RQ.GOAL_MIN && got >= 3;
  h += '<div class="card"><div class="ringrow"><div class="ring">' + ringSvg(min, got) + '<div class="num"><b>' + min + '</b><span>분</span></div></div><div>' +
    '<div class="eyebrow">TODAY</div>' + (both ? '<div style="font-size:19px;margin-top:2px">오늘 목표 모두 달성! 🎉</div>' :
      '<div class="goal2"><i style="background:var(--ink)"></i>움직임 <b>' + min + "</b>/" + RQ.GOAL_MIN + "분" + (min >= RQ.GOAL_MIN ? " ✓" : "") + "</div>" +
      '<div class="goal2"><i style="background:var(--hi)"></i>근력 퀘스트 <b>' + got + "</b>/3" + (got >= 3 ? " ✓" : "") + "</div>") +
    '<div class="weekdots">' + wk.days.map((d, i) => '<i class="' + (d.active ? "on " : "") + (RQ.questCleared(S, d.day) ? "str " : "") + (d.day === t ? "today" : "") + '">' + names[i] + "</i>").join("") + "</div>" +
    '<div class="streak">이번 주 <b>' + wk.active + "</b>/3일" + (streak ? " · 🔥 <b>" + streak + "주</b> 연속" : "") + "</div></div></div></div>";

  if (mode === "strength") return h + viewSnack();
  const st = plan.stage;
  if (plan.kind === "rest") {
    h += '<div class="card quest rest"><div class="scene night wide">' + RQART.svg("rest") + '</div><div class="eyebrow">QUEST CLEAR</div><h2>오늘 퀘스트 클리어!</h2>' +
      '<div class="sub">' + esc(plan.last.id) + " 완료. 달리기는 하루 쉬어야 몸이 강해져요.<br>내일 <b style=\"color:var(--ink)\">" + esc(st.id) + " " + esc(st.title) + "</b> 판이 열려요.</div>" +
      '<div style="height:16px"></div><button class="btn ghost small" data-play="' + plan.last.idx + '">같은 판 한 번 더 (XP만 받기)</button></div>';
  } else if (plan.kind === "allclear") {
    h += '<div class="card quest"><div class="scene">' + RQART.svg("cheer") + '</div><div class="eyebrow">ALL CLEAR</div><h2>30분 달리기 정복!</h2><div class="sub">모든 판을 깼어요. 원하는 판을 골라 계속 달려요.</div>' +
      '<div style="height:16px"></div><button class="btn" data-play="' + st.idx + '">마지막 보스 다시 하기</button></div>';
  } else {
    const rep = plan.kind === "repeat";
    h += '<div class="card quest"><div class="scene">' + RQART.svg(RQ.runSec(st) ? "run" : "fast") + "</div>" +
      '<div class="eyebrow">' + (rep ? "ONE MORE TIME" : st.boss ? "👑 BOSS STAGE" : "TODAY'S QUEST") + " · WORLD " + st.world + "</div>" +
      "<h2>" + esc(st.id) + " " + esc(st.title) + "</h2>" +
      '<div class="sub">' + (rep ? "지난번에 힘들었던 판이에요. 한 번 더 하면 훨씬 쉬워져요." : esc(st.worldName) + " 월드") + "</div>" +
      stageChips(st) + strip(st.segs) + '<p class="desc">' + esc(describe(st.segs)) + "</p>" +
      '<button class="btn" data-play="' + st.idx + '">▶ 시작하기</button>' +
      (rep ? '<button class="link" data-play="' + plan.next.idx + '">그래도 다음 판(' + esc(plan.next.id) + ")으로 갈래요</button>" : "") + "</div>";
  }
  const hasManual = S.log.some((e) => e.day === t && e.kind === "manual");
  h += '<div class="card"><div class="eyebrow">WALK</div><div style="font-size:17px;margin:4px 0 12px">앱 없이 걸었나요?</div><div class="manual">' +
    '<button class="btn green small" id="add10">+10분 기록</button>' + (hasManual ? '<button class="undo" id="undo10">되돌리기</button>' : "") + "</div></div>" +
    '<button class="link" data-tab2="map">달리기 지도 전체 보기</button>';
  return h;
}

// ---------------- map ----------------
const XS = [24, 50, 76, 50];
function viewMap() {
  const t = today();
  let y = 0, nodes = "", lines = [], bans = "", prev = null;
  RQ.WORLDS.forEach((w, wi) => {
    const done = RQ.STAGES.filter((s) => s.world === w.n && s.idx < S.cleared).length;
    const skip = w.n === 1 && S.skippedWorld1;
    bans += '<div class="world-ban" style="top:' + y + 'px"><span class="em">' + w.n + "</span><div><b>WORLD " + w.n + " · " + esc(w.name) + "</b><small>" +
      (skip ? "1분 달리기가 돼서 건너뛰었어요" : ["가볍게 걷기부터", "1분씩 뛰고 걷기", "뛰는 시간 늘리기", "10분 넘게 뛰기", "쉬지 않고 뛰기", "마지막 30분 도전"][wi]) + '</small></div><span class="cnt">' + done + "/4</span></div>";
    y += 92;
    RQ.STAGES.filter((s) => s.world === w.n).forEach((s, i) => {
      const ns = RQ.nodeState(S, s.idx, t), x = XS[i], cy = y + 34;
      const icon = ns === "done" ? (s.boss ? "👑" : "★") : ns === "today" ? (s.boss ? "👑" : "GO") : ns === "tomorrow" ? "🌙" : s.boss ? "👑" : "🔒";
      const lab = ns === "tomorrow" ? "내일 열림" : s.boss ? "보스" : s.short;
      nodes += '<button class="node ' + ns + (s.boss ? " boss" : "") + '" style="left:' + x + "%;top:" + y + 'px" data-stage="' + s.idx + '" ' + (ns === "today" ? 'id="nownode"' : "") +
        '><div class="dot">' + icon + '</div><div class="lab">' + esc(lab) + "</div></button>";
      if (prev) lines.push([prev[0], prev[1], x, cy, s.idx <= S.cleared]);
      prev = [x, cy];
      y += 100;
    });
    prev = null; // no line across world banners
    y += 6;
  });
  const svg = '<svg>' + lines.map((l) => '<line x1="' + l[0] + '%" y1="' + l[1] + '" x2="' + l[2] + '%" y2="' + l[3] + '" style="stroke:' + (l[4] ? "var(--gold)" : "var(--line)") + '" stroke-width="6" stroke-dasharray="' + (l[4] ? "0" : "2 12") + '" stroke-linecap="round"/>').join("") + "</svg>";
  return '<div class="map" style="height:' + y + 'px">' + svg + bans + nodes + "</div>";
}
function openStage(idx) {
  const st = RQ.STAGES[idx], ns = RQ.nodeState(S, idx, today());
  const status = { done: "클리어한 판 · 다시 하면 XP를 받아요", today: "오늘 도전할 판", tomorrow: "내일 열려요 · 오늘은 쉬는 날", lock: "잠김 · 앞 판을 깨면 열려요" }[ns];
  let h = '<div class="eyebrow">WORLD ' + st.world + " · " + esc(st.worldName) + "</div><h2>" + (st.boss ? "👑 " : "") + esc(st.id) + " " + esc(st.title) + '</h2><div class="sub">' + status + "</div>" +
    stageChips(st) + strip(st.segs) + LEGEND + '<p class="desc">' + esc(describe(st.segs)) + "</p>";
  h += RQ.canPlay(S, idx, today()) ? '<button class="btn" data-play="' + idx + '">▶ 시작하기</button>' : '<button class="btn ghost" data-close>닫기</button>';
  $("sheetbox").innerHTML = h;
  $("sheet").classList.add("show"); armBack();
}

// ---------------- log ----------------
function viewLog() {
  const t = today(), wk = RQ.week(S, t);
  const days = new Set(S.log.filter((e) => e.sec >= 300).map((e) => e.day)).size;
  const total = Math.floor(S.log.reduce((a, e) => a + e.sec, 0) / 60);
  const cleared = S.cleared - (S.skippedWorld1 ? 4 : 0);
  const max = Math.max(RQ.GOAL_MIN * 1.5, ...wk.days.map((d) => d.min));
  const names = ["월", "화", "수", "목", "금", "토", "일"];
  let h = '<div class="tiles"><div class="tile"><span>깬 판</span><b>' + cleared + "<small>/ " + (RQ.STAGES.length - (S.skippedWorld1 ? 4 : 0)) + '</small></b></div>' +
    '<div class="tile"><span>운동한 날</span><b>' + days + '<small>일</small></b></div><div class="tile"><span>총 운동 시간</span><b>' + (total >= 60 ? Math.floor(total / 60) + "<small>시간</small> " + (total % 60) : total) + '<small>분</small></b></div>' +
    '<div class="tile"><span>주 3회 연속</span><b>' + RQ.streakWeeks(S, t) + "<small>주</small></b></div></div>";
  h += '<div class="card"><div class="eyebrow">THIS WEEK</div><div style="font-size:17px;margin-top:4px">이번 주 ' + wk.days.reduce((a, d) => a + d.min, 0) + "분 · 점선은 하루 목표 " + RQ.GOAL_MIN + "분</div>" +
    '<div class="bars"><div class="goal" style="bottom:' + ((RQ.GOAL_MIN / max) * 128 + 22) + 'px"></div>' +
    wk.days.map((d, i) => '<div class="col' + (d.min ? "" : " zero") + (d.day === t ? " today" : "") + '"><small>' + (d.min || "") + '</small><i style="height:' + Math.round((d.min / max) * 128) + 'px"></i><em>' + names[i] + "</em></div>").join("") + "</div></div>";
  const recent = S.log.slice(-15).reverse();
  const rateIc = { easy: "😎", ok: "🙂", hard: "🥵" };
  const nb = RQ.allBadges(S);
  h += '<div class="card"><div class="eyebrow">BADGES</div><div style="font-size:17px;margin:4px 0 4px">모은 배지 ' + nb + "개</div>" + RQ.SNACKS.map((x) => {
    const b = RQ.badgesFor(S, x.id), steps = RQ.BADGE_STEPS[x.kind], unit = x.kind === "time" ? "" : "개";
    const fmt = (v) => (x.kind === "time" ? (v >= 60 ? v / 60 + "분" : v + "초") : v.toLocaleString("ko-KR") + unit);
    const prevStep = b.earned.length ? b.earned[b.earned.length - 1] : 0;
    const pct = b.next ? Math.round(((b.total - prevStep) / (b.next - prevStep)) * 100) : 100;
    return '<div class="brow"><div class="bt"><span>' + esc(x.name) + "</span><small>누적 " + fmt(b.total) + (b.next ? " · 다음 배지까지 " + fmt(b.next - b.total) : " · 모두 모았어요!") + "</small></div>" +

// ---------------- snack engine ----------------
// SK = { id, n, startAt, pausedMs, pausedAt, said, done } — counts reps on a fixed tempo after a 3-second ready count.
let SK = null, skTimer = null;
const READY = 3;
const skEl = () => ((SK.pausedAt || Date.now()) - SK.startAt - SK.pausedMs) / 1000 - READY;
function startSnack(id) {
  if (R) return;
  audioInit(); closeAll();
  const x = RQ.SNACK[id];
  $("skbox").classList.remove("sk-done");
  SK = { id, n: RQ.snackN(S, id), tempo: RQ.tempoOf(S, id), startAt: Date.now(), pausedMs: 0, pausedAt: 0, said: {}, done: 0 };
  $("skbox").innerHTML = '<div class="sk-top"><b style="font-weight:400">' + esc(x.name) + '</b><button id="sk-stop">그만하기</button></div>' +
    '<div class="sk-pic">' + RQART.ex(id, 0).replace("<svg", '<svg id="sk-a"') + RQART.ex(id, 1).replace("<svg", '<svg id="sk-b" class="off"') + "</div>" +
    '<div class="sk-num" id="sk-num"></div><div class="sk-cue" id="sk-cue"></div><div class="sk-bar"><i id="sk-bar"></i></div><div class="sk-sp"></div>' +
    '<div class="sk-btns"><button class="btn ghost" id="sk-pause">일시정지</button><button class="btn" id="sk-stop2">끝내기</button></div>';
  $("snack").classList.add("show"); document.body.style.overflow = "hidden"; armBack();

}
function skOnce(key, fn) { if (!SK.said[key]) { SK.said[key] = 1; fn(); } }
function skTick() {
  if (!SK) return;

  let frame = 0, num = "", cue = "", prog = 0;
  if (el < 0) {
    const c = Math.ceil(-el);
    num = c; cue = "준비";
    if (!paused) skOnce("r" + c, () => { say(RQ.koNum(c)); beep(520, .1); });
  } else if (x.kind === "reps") {
    skOnce("go", () => { say("시작!"); beep(880, .18); });
    const done = Math.min(SK.n, Math.floor(el / SK.tempo));
    if (done > SK.done) { SK.done = done; say(RQ.koNum(done)); beep(done === SK.n ? 1047 : 740, .12); buzz(35); }
    if (done >= SK.n) return skFinish(true);
    frame = (el % SK.tempo) / SK.tempo < 0.5 ? 1 : 0;
    num = done + "<small>/ " + SK.n + "</small>";
    cue = paused ? "잠깐 멈춤" : x.say[frame ? 0 : 1];
    if (!paused && SK.n - done === 1) cue = "마지막! " + cue;
    prog = (el / SK.tempo) / SK.n;
  } else {
    skOnce("go", () => { say("시작!"); beep(880, .18); });
    const left = SK.n - el;
    SK.done = Math.min(SK.n, Math.floor(el));
    if (left <= 0) { SK.done = SK.n; return skFinish(true); }
    const s = Math.ceil(left);
    if (!paused) {
      if (SK.n >= 30 && s === Math.ceil(SK.n / 2)) skOnce("half", () => say("절반 지났어요!"));
      if (s === 10 && SK.n > 15) skOnce("t10", () => say("10초 남았어요."));
      if (s <= 3) skOnce("c" + s, () => { say(RQ.koNum(s)); beep(620, .1); });
    }
    frame = x.tempo ? Math.floor(el / (x.tempo / 2)) % 2 : Math.floor(el / 1.5) % 2;
    num = s + "<small>초</small>";
    cue = paused ? "잠깐 멈춤" : x.id === "knee" ? "번갈아 들어요" : "버텨요!";
    prog = el / SK.n;
  }
  $("sk-a").classList.toggle("off", frame === 1); $("sk-b").classList.toggle("off", frame !== 1);
  $("sk-num").innerHTML = num; $("sk-cue").textContent = cue;
  $("sk-bar").style.width = Math.max(0, Math.min(100, prog * 100)).toFixed(1) + "%";
  $("sk-pause").textContent = paused ? "▶ 계속" : "일시정지";
}
function skPause() {

  skTick();
}
function skFinish(complete) {

  SK = null;
  if (!done) { $("snack").classList.remove("show"); document.body.style.overflow = ""; return render(); }
  const out = RQ.addSnack(S, id, done, sec, today()); persist();
  if (complete) { say("끝! 잘했어요.", true); buzz(BUZZ.done); beep(784, .15); setTimeout(() => beep(1047, .3), 170); }
  const unit = x.kind === "time" ? "초" : "개", n = RQ.snacksOn(S, today());
  const inQuest = out.quest.some((it) => it.id === id), got = out.quest.filter((it) => it.done).length;
  if (out.questClear) say("근력 퀘스트 클리어!", true);
  const parts = [];
  if (out.xp) parts.push("세트 +" + RQ.SNACK_XP);

    '<div class="clear-title" style="font-size:32px">' + (out.questClear ? "근력 퀘스트 클리어!" : out.full ? esc(x.name) + " " + done + unit + " 완료!" : esc(x.name) + " " + done + unit + " 했어요") + "</div>" +

      (out.xp ? parts.join(" · ") + " · 오늘 " + n + "세트째" + (inQuest && !out.questClear && !RQ.questCleared(S, today()) ? " · 퀘스트 " + got + "/3" : "") : "절반 넘게 하면 한 세트로 쳐요. 다음엔 조금 더!") + "</small></div>" +
    out.badges.map((b) => '<div class="badge-new"><span class="medal on">★</span>새 배지 · ' + esc(RQ.badgeLabel(id, b)) + "</div>").join("") +

}

// ---------------- sound / voice / vibration ----------------
let AC = null;
function audioInit() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} }
function beep(freq, dur) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = "square"; o.frequency.value = freq; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
let koVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); koVoice = vs.find((v) => /ko[-_]KR/i.test(v.lang)) || vs.find((v) => /^ko/i.test(v.lang)) || null; } catch (e) {} }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// keep = queue after whatever is being spoken instead of cutting it off
function say(text, keep) {
  if (!S.voice || !("speechSynthesis" in window)) return;
  try { if (!keep) speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; if (koVoice) u.voice = koVoice; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const BUZZ = { run: [400, 150, 400, 150, 400], walk: [250], fast: [250, 120, 250], warm: [200], cool: [200, 100, 200], done: [300, 100, 300, 100, 700] };

// ---------------- wake lock ----------------
let lock = null;
async function wake() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} }
function unwake() { try { lock && lock.release(); } catch (e) {} lock = null; }

// ---------------- run engine ----------------
// R = { idx, startAt, pausedMs, pausedAt, seen, said } — saved so a reload mid-run can resume.
let R = null, timer = null;
const RUNKEY = "runquest-run";
const saveRun = () => { try { R ? localStorage.setItem(RUNKEY, JSON.stringify(R)) : localStorage.removeItem(RUNKEY); } catch (e) {} };
const elapsed = () => ((R.pausedAt || Date.now()) - R.startAt - R.pausedMs) / 1000;

function startRun(idx) {
  audioInit(); closeAll();
  R = { idx, startAt: Date.now(), pausedMs: 0, pausedAt: 0, seen: -1, said: {} };
  saveRun(); openRun();
}
function openRun() {
  const st = RQ.STAGES[R.idx];
  $("r-stage").textContent = (st.boss ? "👑 " : "") + st.id + " " + st.title;
  $("r-prog").innerHTML = st.segs.map((x) => '<i style="flex:' + x[1] + '"></i>').join("") + '<span class="me" id="r-me"></span>';
  $("run").classList.add("show"); $("dimmer").classList.remove("show");
  document.body.style.overflow = "hidden"; armBack();
  wake(); clearInterval(timer); timer = setInterval(tick, 250); tick();
}
function tick() {
  if (!R) return;
  if (!R.pausedAt && Date.now() - (R.beat || 0) > 5000) { R.beat = Date.now(); saveRun(); }
  const st = RQ.STAGES[R.idx], segs = st.segs, el = elapsed(), pos = RQ.segmentAt(segs, el), total = RQ.totalSec(st);
  if (pos.done) return complete(true);
  const k = pos.type, rn = RQ.runNo(segs, pos.i);
  if (pos.i !== R.seen) {
    const jumped = R.seen >= 0 && pos.i > R.seen + 1;      // screen was off for a whole segment
    const late = pos.into > 4;                               // came back mid-segment
    R.seen = pos.i; saveRun();
    say(late || jumped ? "지금은 " + RQ.NAMES[k] + ". " + RQ.fmtSay(Math.ceil(pos.left)) + " 남았어요." : RQ.announce(segs, pos.i));
    buzz(BUZZ[k]); if (!late) beep(k === "run" ? 988 : 660, 0.25);
  }
  // halfway cue on longer runs, 3-2-1 beeps before every switch
  const hk = "h" + pos.i;
  if (k === "run" && pos.len >= 120 && pos.into >= pos.len / 2 && !R.said[hk]) { R.said[hk] = 1; if (pos.into - pos.len / 2 < 5) say("절반 지났어요. 좋아요!"); }
  const s = Math.ceil(pos.left);
  if (s <= 3 && s >= 1 && !R.pausedAt && !R.said[pos.i + "-" + s] && !document.hidden) { R.said[pos.i + "-" + s] = 1; beep(s === 1 ? 880 : 520, 0.12); }
  if (k === "run" && pos.len >= 60 && s === 10 && !R.said["t" + pos.i] && !R.pausedAt) { R.said["t" + pos.i] = 1; say("10초 남았어요."); }

  const run = $("run");
  run.className = "ov show k-" + k + (R.pausedAt ? " paused" : "");
  const artKey = R.pausedAt ? "tired" : { run: "run", walk: "walk", fast: "fast", warm: "stretch", cool: "walk" }[k];
  if ($("r-art").dataset.k !== artKey) {
    $("r-art").dataset.k = artKey;
    $("r-art").innerHTML = RQART.svg(artKey, { disc: k === "run" && !R.pausedAt ? "#F1E4D1" : "#fbf6ee" });
    $("r-art").style.setProperty("--bob", artKey === "run" ? ".42s" : artKey === "tired" ? "2.4s" : ".9s");
  }
  const kind = R.pausedAt ? "잠깐 멈춤" : RQ.NAMES[k];
  $("r-kind").textContent = kind; $("d-kind").textContent = kind;
  $("r-count").textContent = k === "run" && rn.all > 1 ? rn.all + "번 중 " + rn.n + "번째" + (rn.n === rn.all ? " · 마지막!" : "") : k === "warm" ? "몸 풀기" : k === "cool" ? "거의 다 왔어요" : "";
  $("r-clock").textContent = RQ.clock(pos.left); $("d-clock").textContent = RQ.clock(pos.left);
  const nx = segs[pos.i + 1], nxt = nx ? "다음: " + RQ.NAMES[nx[0]] + " " + RQ.fmtSay(nx[1]) : "다음: 클리어! 🎉";
  $("r-next").textContent = nxt; $("d-next").textContent = nxt;
  $("r-total").textContent = RQ.clock(total - el);
  [...$("r-prog").children].forEach((c, j) => { if (c.tagName === "I") c.className = j < pos.i ? "past" : j === pos.i ? "cur" : ""; });
  $("r-me").style.left = "calc(" + ((el / total) * 100).toFixed(2) + "% - 2px)";
  $("r-pause").textContent = R.pausedAt ? "▶ 계속" : "일시정지";
}
function togglePause() {
  if (!R) return;
  if (R.pausedAt) { R.pausedMs += Date.now() - R.pausedAt; R.pausedAt = 0; say("다시 시작해요."); wake(); }
  else { R.pausedAt = Date.now(); say("잠깐 멈췄어요."); }
  saveRun(); tick();
}
function complete(done) {
  const st = RQ.STAGES[R.idx], sec = Math.min(elapsed(), RQ.totalSec(st));
  clearInterval(timer); timer = null; unwake();
  const idx = R.idx; R = null; saveRun();
  $("run").classList.remove("show"); document.body.style.overflow = "";
  // Stopping during the cool-down walk still clears the stage: every working segment was finished.
  done = done || RQ.reachedCooldown(st.segs, sec);
  const out = RQ.finish(S, idx, sec, done, today()); persist();
  if (done) { buzz(BUZZ.done); beep(784, .15); setTimeout(() => beep(1047, .3), 170); say(st.boss ? "보스 격파! 정말 대단해요." : "클리어! 수고했어요."); }
  showResult(st, out, done, sec);
}
function showResult(st, out, done, sec) {
  const L = RQ.level(S.xp);
  let h;
  if (done) {
    const title = out.worldClear ? "월드 " + st.world + " 정복!" : st.boss && out.newClear ? "보스 격파!" : out.newClear ? "STAGE CLEAR!" : "한 번 더 클리어!";
    const next = RQ.STAGES[S.cleared];
    h = '<div class="burst">' + RQART.svg("cheer") + '</div><div class="clear-title">' + title + "</div>" +
      '<div class="sub" style="text-align:center">' + esc(st.id) + " " + esc(st.title) + " · " + mins(sec) + "</div>" +
      '<div class="gain">+' + out.xp + " XP" + (out.levelUp ? "<small>🎉 레벨 업! 이제 Lv." + L.lv + "</small>" : "") +
      (out.newClear && next ? "<small>내일 " + esc(next.id) + " 판이 열려요</small>" : "") + (out.newClear && !next ? "<small>모든 판을 깼어요! 30분 달리기 성공!</small>" : "") + "</div>" +
      '<div class="rate-q">오늘 판은 어땠어요?</div><div class="rate">' +
      '<button data-rate="easy"><span>😎</span>쉬웠다</button><button data-rate="ok"><span>🙂</span>적당했다</button><button data-rate="hard"><span>🥵</span>힘들었다</button></div>' +
      '<div class="hint" id="ratehint"></div><button class="btn green" id="resDone">확인</button>';
  } else {
    h = '<div class="burst">' + RQART.svg("tired") + '</div><div class="clear-title" style="color:var(--ink)">여기까지 OK!</div>' +
      '<div class="sub" style="text-align:center">' + mins(sec) + " 움직인 건 오늘 운동량에 들어갔어요.<br>판은 마무리 걷기 전까지 해야 깨져요. 다음에 다시 도전!</div>" +
      '<div class="gain">+' + out.xp + " XP</div>" + '<div style="height:12px"></div><button class="btn green" id="resDone">확인</button>';
  }
  R_res = { idx: st.idx };
  $("resultbox").innerHTML = h; $("result").classList.add("show"); armBack();
}
let R_res = null;

// ---------------- events ----------------
document.addEventListener("click", (e) => {
  const t = e.target;
  const nb = t.closest("nav button"); if (nb) return go(nb.dataset.tab);
  const t2 = t.closest("[data-tab2]"); if (t2) return go(t2.dataset.tab2);
  const md = t.closest("[data-mode]"); if (md) { S.mode = md.dataset.mode; persist(); return render(); }
  const sg = t.closest("[data-snackgo]"); if (sg) return startSnack(sg.dataset.snackgo);
  const sn = t.closest("[data-snack]"); if (sn) return openSnackSheet(sn.dataset.snack);
  const sr = t.closest("[data-srate]");
  if (sr) {
    document.querySelectorAll("[data-srate]").forEach((b) => b.classList.toggle("sel", b === sr));
    const id = sr.dataset.sid, x = RQ.SNACK[id], unit = x.kind === "time" ? "초" : "개";
    const res = RQ.rateSnack(S, id, sr.dataset.srate); persist();
    $("srhint").textContent = sr.dataset.srate === "ok" ? "좋아요, 이대로 갈게요." :
      res ? "다음엔 " + res + unit + "로 " + (sr.dataset.srate === "easy" ? "늘릴게요. 레벨 업!" : "줄일게요. 천천히 가요.") : (sr.dataset.srate === "easy" ? "이미 최대 개수예요. 빠르기를 바꿔 봐요." : "이미 가장 적은 개수예요.");
    return;
  }
  const spd = t.closest("[data-speed]");
  if (spd) { const id = $("sheetbox").dataset.snack; RQ.setSnackSpeed(S, id, spd.dataset.speed); persist(); return openSnackSheet(id); }
  const stp = t.closest("[data-stepn]");
  if (stp) { const id = $("sheetbox").dataset.snack, x = RQ.SNACK[id]; RQ.setSnackN(S, id, RQ.snackN(S, id) + +stp.dataset.stepn * x.step); persist(); return openSnackSheet(id); }
  const pl = t.closest("[data-play]"); if (pl) return startRun(+pl.dataset.play);
  const nd = t.closest("[data-stage]"); if (nd) return openStage(+nd.dataset.stage);
  if (t.closest("[data-close]")) return closeAll();
  const rt = t.closest("[data-rate]");
  if (rt && R_res) {
    document.querySelectorAll("[data-rate]").forEach((b) => b.classList.toggle("sel", b === rt));
    RQ.rate(S, R_res.idx, rt.dataset.rate); persist();
    $("ratehint").textContent = { easy: "좋아요! 다음 판으로 쭉 가요.", ok: "딱 좋은 속도예요.", hard: "다음엔 이 판을 한 번 더 하자고 알려드릴게요." }[rt.dataset.rate];
    return;
  }
  switch (t.id) {
    case "resDone": $("result").classList.remove("show"); R_res = null; return go("today");
    case "add10": RQ.addManual(S, 10, today()); persist(); buzz(80); return render();
    case "undo10": RQ.undoManual(S, today()); persist(); return render();
    case "fromW2": case "fromW1": S = RQ.start(S, t.id === "fromW2" ? 2 : 1); persist(); closeAll(); return go("today");
    case "voiceT": S.voice = !S.voice; persist(); return render();
    case "testSnd": audioInit(); beep(988, .25); buzz(BUZZ.run); { const v = S.voice; S.voice = true; say("뛰기 1분. 시작!"); S.voice = v; } return;
    case "exportBtn": {
      const day = today(), blob = new Blob([RQ.exportData(S, new Date().toISOString())], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "runquest-backup-" + day + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      S.lastBackup = day; persist();
      return dialog("<h2>백업 파일을 저장했어요</h2><p>다운로드 폴더의 <b style=\"color:var(--ink)\">" + a.download + '</b> 파일이에요. 새 폰에서는 기록 탭 → 백업 불러오기에서 이 파일을 고르면 돼요.</p><button class="btn" data-close>확인</button>');
    }
    case "importBtn": $("importFile").value = ""; return $("importFile").click();
    case "importYes": if (pendingImport) { S = pendingImport; pendingImport = null; persist(); } closeAll(); return go("today");
    case "resetAll":
      return dialog('<h2>처음부터 다시 할까요?</h2><p>깬 판, XP, 기록이 모두 지워지고 되돌릴 수 없어요.</p><button class="btn" id="resetYes">모두 지우고 다시 시작</button><button class="btn ghost" data-close>취소</button>');
    case "resetYes": S = RQ.fresh(); persist(); closeAll(); render(); return intro();
    case "sk-pause": return skPause();
    case "sk-stop": case "sk-stop2": return skFinish(false);
    case "sk-close": return closeSnack();
    case "r-pause": return togglePause();
    case "r-stop": return askStop();
    case "resumeYes": closeAll(); return openRun();
    case "resumeNo": closeAll(); openRun(); return complete(false);
    case "stopYes": closeAll(); return complete(false);
    case "r-dim": $("dimmer").classList.add("show"); return;
    case "dimmer": $("dimmer").classList.remove("show"); return;
  }
  if (t.closest("#dimmer")) $("dimmer").classList.remove("show");
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && R) { wake(); tick(); } if (!document.hidden && SK) { wake(); skTick(); } });
// a running stage cannot be closed by the Android back button by accident
addEventListener("beforeunload", (e) => { if (R) { e.preventDefault(); e.returnValue = ""; } });

// ---------------- backup import ----------------
let pendingImport = null;
document.addEventListener("change", (e) => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const st = RQ.importData(String(fr.result));
      pendingImport = st;
      const sets = st.log.filter((x) => x.kind === "snack").length;
      dialog("<h2>이 백업을 불러올까요?</h2><p>백업 내용: 깬 판 " + st.cleared + "개 · Lv." + RQ.level(st.xp).lv + " · 기록 " + st.log.length + "개(근력 " + sets + "세트)</p>" +
        '<p class="warn">지금 이 폰의 기록은 백업 내용으로 바뀌어요.</p><button class="btn" id="importYes">불러오기</button><button class="btn ghost" data-close>취소</button>');
    } catch (err) { dialog("<h2>불러올 수 없어요</h2><p>" + esc(err.message) + '</p><button class="btn" data-close>확인</button>'); }
  };
  fr.readAsText(e.target.files[0]);
});

// ---------------- Android back button ----------------
// While anything is open (a run, a snack set, a sheet, a dialog, another tab) one extra history entry is kept,
// and "back" closes the top thing instead of closing the app.
let backArmed = false;
function armBack() { if (!backArmed) { try { history.pushState({ rq: 1 }, ""); backArmed = true; } catch (e) {} } }
function askStop() {
  const cool = RQ.reachedCooldown(RQ.STAGES[R.idx].segs, elapsed());
  return dialog("<h2>그만할까요?</h2><p>" + (cool ? "본 운동은 다 끝냈어요. 지금 그만해도 <b style=\"color:var(--ink)\">클리어로 인정</b>돼요. 마무리 걷기를 끝까지 하면 몸이 더 잘 풀려요."
    : "지금까지 움직인 " + mins(elapsed()) + "은 기록돼요. 판은 마무리 걷기 전까지 해야 깨져요.") +
    '</p><button class="btn" id="stopYes">' + (cool ? "클리어하고 끝내기" : "그만하기") + '</button><button class="btn ghost" data-close>계속하기</button>');
}
function closeSnack() { $("snack").classList.remove("show"); document.body.style.overflow = ""; render(); }
const isOpen = (id) => $(id).classList.contains("show");
addEventListener("popstate", () => {
  backArmed = false;
  if (isOpen("dialog")) { closeAll(); if (R || SK) armBack(); return; }
  if (R) { if (isOpen("dimmer")) { $("dimmer").classList.remove("show"); return armBack(); } return askStop(); }
  if (SK) { skFinish(false); if (isOpen("snack")) armBack(); return; }
  if (isOpen("snack")) return closeSnack();
  if (isOpen("result")) { $("result").classList.remove("show"); R_res = null; return go("today"); }
  if (isOpen("sheet")) { closeAll(); if (tab !== "today") armBack(); return; }
  if (tab !== "today") return go("today");
  history.back(); // nothing open on the first tab: leave the app
});

// ---------------- boot ----------------
(function boot() {
  render();
  if (!S.started) return intro();
  try {
    const saved = JSON.parse(localStorage.getItem(RUNKEY) || "null");
    if (saved && Date.now() - saved.startAt < 3 * 3600e3) {
      // The app was closed mid-run: freeze the clock at the last heartbeat and ask what to do.
      R = saved;
      if (!R.pausedAt) { R.pausedAt = Math.max(R.startAt, R.beat || R.startAt); saveRun(); }
      const st = RQ.STAGES[R.idx];
      dialog('<h2>하던 판이 있어요</h2><p>' + esc(st.id + " " + st.title) + "을 " + mins(elapsed()) + ' 하다가 멈췄어요. 이어서 할까요?</p>' +
        '<button class="btn" id="resumeYes">이어서 하기</button><button class="btn ghost" id="resumeNo">그만하고 기록하기</button>');
    } else localStorage.removeItem(RUNKEY);
  } catch (e) {}
})();
</script>
</body>
</html>
